<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.6;padding:2rem}
h1{font-size:1.4rem;color:#1e3a5f;margin-bottom:1.5rem}
.card{background:#fff;border-radius:10px;padding:1.5rem;box-shadow:0 1px 3px rgba(0,0,0,.1);max-width:600px;margin-bottom:1rem}
.card h2{font-size:1rem;color:#475569;margin-bottom:.8rem}
.drop{border:2px dashed #cbd5e1;border-radius:8px;padding:2.5rem;text-align:center;cursor:pointer;transition:all .2s}
.drop.over{border-color:#2563eb;background:#eff6ff}
.drop p{color:#64748b;font-size:.9rem}
.drop .icon{font-size:2rem;margin-bottom:.5rem;color:#94a3b8}
.fname{margin-top:.8rem;font-size:.85rem;color:#1e3a5f;font-weight:600}
button{background:#2563eb;color:#fff;border:none;padding:.6rem 1.5rem;border-radius:6px;font-size:.9rem;font-weight:600;cursor:pointer;margin-top:1rem}
button:hover{background:#1d4ed8}
button:disabled{background:#94a3b8;cursor:not-allowed}
.status{margin-top:1rem;padding:.8rem;border-radius:6px;font-size:.85rem;display:none}
.status.ok{display:block;background:#dcfce7;color:#166534}
.status.err{display:block;background:#fee2e2;color:#991b1b}
.status.loading{display:block;background:#eff6ff;color:#1e40af}
a{color:#2563eb;text-decoration:none}
</style>
</head>
<body>
<h1>Data Admin</h1>
<div class="card">
  <h2>Upload Country x Product Export File (.xlsx)</h2>
  <div class="drop" id="drop">
    <div class="icon">+</div>
    <p>Drag and drop Excel file here, or click to browse</p>
    <div class="fname" id="fname"></div>
  </div>
  <input type="file" id="finput" accept=".xlsx" style="display:none">
  <button id="btn" disabled>Upload & Rebuild</button>
  <div class="status" id="status"></div>
</div>
<p><a href="/">Back to site</a></p>

<script>
const drop=document.getElementById('drop');
const finput=document.getElementById('finput');
const btn=document.getElementById('btn');
const fname=document.getElementById('fname');
const status=document.getElementById('status');
let file=null;

function setFile(f){
  if(!f||!f.name.endsWith('.xlsx')){
    status.className='status err';status.textContent='Please select an .xlsx file';return;
  }
  file=f;
  fname.textContent=f.name+' ('+Math.round(f.size/1024)+' KB)';
  btn.disabled=false;
  status.className='status';status.style.display='none';
}

drop.addEventListener('click',()=>finput.click());
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});
drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');setFile(e.dataTransfer.files[0])});
finput.addEventListener('change',()=>{if(finput.files[0])setFile(finput.files[0])});

btn.addEventListener('click',async()=>{
  if(!file)return;
  btn.disabled=true;
  status.className='status loading';status.textContent='Uploading and rebuilding data...';
  const fd=new FormData();
  fd.append('file',file);
  try{
    const r=await fetch('/upload',{method:'POST',body:fd});
    const d=await r.json();
    if(d.ok){
      status.className='status ok';
      status.textContent='Data rebuilt successfully. '+d.output;
    }else{
      status.className='status err';
      status.textContent='Error: '+d.error;
    }
  }catch(e){
    status.className='status err';
    status.textContent='Upload failed: '+e.message;
  }
  btn.disabled=false;
});
</script>
</body>
</html>
