<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Admin</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.6;padding:2rem}
h1{font-size:1.4rem;color:#1e3a5f;margin-bottom:1.5rem}
.card{background:#fff;border-radius:10px;padding:1.5rem;box-shadow:0 1px 3px rgba(0,0,0,.1);max-width:600px;margin-bottom:1rem}
.card h2{font-size:1rem;color:#475569;margin-bottom:.8rem}
.drop{border:2px dashed #cbd5e1;border-radius:8px;padding:2.5rem;text-align:center;cursor:pointer;transition:all .2s}
.drop.over{border-color:#2563eb;background:#eff6ff}
.drop p{color:#64748b;font-size:.9rem}
.drop .icon{font-size:2rem;margin-bottom:.5rem;color:#94a3b8}
.fname{margin-top:.8rem;font-size:.85rem;color:#1e3a5f;font-weight:600}
button{background:#2563eb;color:#fff;border:none;padding:.6rem 1.5rem;border-radius:6px;font-size:.9rem;font-weight:600;cursor:pointer;margin-top:1rem}
button:hover{background:#1d4ed8}
button:disabled{background:#94a3b8;cursor:not-allowed}
.status{margin-top:1rem;padding:.8rem;border-radius:6px;font-size:.85rem;display:none}
.status.ok{display:block;background:#dcfce7;color:#166534}
.status.err{display:block;background:#fee2e2;color:#991b1b}
.status.loading{display:block;background:#eff6ff;color:#1e40af}
.preview{margin-top:1rem;font-size:.82rem;max-height:200px;overflow:auto;background:#f8fafc;padding:.5rem;border-radius:4px;display:none}
a{color:#2563eb;text-decoration:none}
</style>
</head>
<body>
<h1>Data Admin</h1>
<div class="card">
  <h2>Upload Country x Product Export File (.xlsx)</h2>
  <p style="font-size:.82rem;color:#64748b;margin-bottom:.8rem">File must have columns: Type (E/RE) | Country Code | Country Name | HS4 Code | Product Name | Prev Value | Prev Tons | Prev Add | Cur Value | Cur Tons | Cur Add</p>
  <div class="drop" id="drop">
    <div class="icon">+</div>
    <p>Drag and drop Excel file here, or click to browse</p>
    <div class="fname" id="fname"></div>
  </div>
  <input type="file" id="finput" accept=".xlsx,.xls" style="display:none">
  <button id="btn" disabled>Process & Download JSON</button>
  <div class="status" id="status"></div>
  <div class="preview" id="preview"></div>
</div>
<p><a href="index.html">Back to site</a></p>

<script>
const drop=document.getElementById('drop');
const finput=document.getElementById('finput');
const btn=document.getElementById('btn');
const fname=document.getElementById('fname');
const status=document.getElementById('status');
const preview=document.getElementById('preview');
let file=null;
let HS4={};

// Load HS4 short titles
fetch('data/hs4_names.json').then(r=>r.json()).then(d=>{HS4=d}).catch(()=>{});

function setFile(f){
  if(!f||(!f.name.endsWith('.xlsx')&&!f.name.endsWith('.xls'))){
    status.className='status err';status.textContent='Please select an .xlsx or .xls file';return;
  }
  file=f;
  fname.textContent=f.name+' ('+Math.round(f.size/1024)+' KB)';
  btn.disabled=false;
  status.className='status';status.style.display='none';
  preview.style.display='none';
}

drop.addEventListener('click',()=>finput.click());
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});
drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');setFile(e.dataTransfer.files[0])});
finput.addEventListener('change',()=>{if(finput.files[0])setFile(finput.files[0])});

function pad4(n){return String(n).padStart(4,'0')}

function parseVal(v){
  if(v==null||v===''||v==='-')return 0;
  const n=Number(v);
  return isNaN(n)?0:Math.round(n*100)/100;
}

function processExcel(data){
  const wb=XLSX.read(data,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});

  // Collect E and RE per (country, hs4)
  const acc={};
  let parsed=0;

  for(const row of rows){
    const typ=String(row[0]||'').trim().toUpperCase();
    if(typ!=='E'&&typ!=='RE')continue;

    const cc=String(Math.floor(Number(row[1])));
    const hs=pad4(Math.floor(Number(row[3])));
    if(cc==='NaN'||hs==='NaN')continue;

    const prevVal=parseVal(row[5]);
    const curVal=parseVal(row[8]);

    const key=cc+'|'+hs;
    if(!acc[key])acc[key]={cc,hs,e_cur:0,e_prev:0,re_cur:0,re_prev:0};

    if(typ==='E'){
      acc[key].e_cur+=curVal;
      acc[key].e_prev+=prevVal;
    }else{
      acc[key].re_cur+=curVal;
      acc[key].re_prev+=prevVal;
    }
    parsed++;
  }

  // Build per-country product lists
  const byCountry={};
  for(const v of Object.values(acc)){
    const cur=Math.round((v.e_cur+v.re_cur)*100)/100;
    const prev=Math.round((v.e_prev+v.re_prev)*100)/100;
    if(cur===0&&prev===0)continue;

    const re=cur>0?Math.round(v.re_cur/cur*1000)/10:0;
    const name=HS4[v.hs]||v.hs;

    if(!byCountry[v.cc])byCountry[v.cc]=[];
    byCountry[v.cc].push({c:v.hs,n:name,cur,prev,re});
  }

  // Sort each country's products by current value desc
  for(const cc of Object.keys(byCountry)){
    byCountry[cc].sort((a,b)=>b.cur-a.cur);
  }

  return {data:byCountry,rowsParsed:parsed,countries:Object.keys(byCountry).length};
}

btn.addEventListener('click',()=>{
  if(!file)return;
  btn.disabled=true;
  status.className='status loading';status.textContent='Processing Excel file...';
  preview.style.display='none';

  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const result=processExcel(new Uint8Array(e.target.result));
      const json=JSON.stringify(result.data);

      // Download as JSON
      const blob=new Blob([json],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download='country_products.json';
      a.click();
      URL.revokeObjectURL(url);

      status.className='status ok';
      status.textContent=`Done! ${result.rowsParsed} rows parsed, ${result.countries} countries. File downloaded as country_products.json — place it in data/ folder.`;

      // Show preview
      const countries=Object.keys(result.data);
      let html='<b>Preview (first 3 countries):</b><br>';
      for(const cc of countries.slice(0,3)){
        const prods=result.data[cc].slice(0,3);
        html+=`<b>Country ${cc}:</b> ${prods.map(p=>`${p.n} (${p.cur} thsd, re:${p.re}%)`).join(', ')}...<br>`;
      }
      preview.innerHTML=html;
      preview.style.display='block';
    }catch(err){
      status.className='status err';
      status.textContent='Error processing file: '+err.message;
    }
    btn.disabled=false;
  };
  reader.readAsArrayBuffer(file);
});
</script>
</body>
</html>
